- name: Deploy Ceph monitors & managers
  hosts: "{{ ceph_mon_group | default('controllers') }}"
  become: true
  roles:
    - role: mon
      tags:
        - ceph-mon
    - role: mgr
      tags:
        - ceph-mgr

- name: Deploy Ceph OSDs
  hosts: "{{ ceph_osd_group | default('cephs') }}"
  become: true
  roles:
    - role: osd
      tags:
        - ceph-osd

- name: Apply Ceph configuration
  hosts: "{{ ceph_mon_group | default('controllers') }}"
  become: true
  roles:
    - role: configure
      tags:
        - ceph-configure

- name: Deploy Ceph RADOS Gateways
  hosts: "{{ ceph_rgw_group | default('controllers') }}"
  become: true
  roles:
    - role: rgw
      tags:
        - ceph-rgw
      when: ceph_rgw_enabled | bool

- name: Deploy Ceph monitoring stack
  hosts: "{{ ceph_mon_group | default('controllers') }}"
  become: true
  roles:
    - role: monitoring
      tags:
        - ceph-monitoring
