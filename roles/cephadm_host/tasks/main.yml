# Included from a component role (mon/mgr/osd) whose block sets `environment`
# (CEPHADM_IMAGE/FSID/CONFIG); the tasks here inherit it for fast cephadm shell.

- name: Get the cephadm public key
  # No native module exists for `ceph cephadm get-pub-key`. Raw command: the
  # cephadm binary ignores our CEPHADM_FSID/CEPHADM_CONFIG env, so pass
  # --fsid/--config explicitly for speed (image comes from the CEPHADM_IMAGE
  # env). Runs once on the admin host; run_once makes the registered result
  # available to EVERY host in the play (no fact-publishing dance needed).
  ansible.builtin.command: >-
    cephadm shell
    --fsid {{ ceph_fsid }}
    --config /var/lib/ceph/{{ ceph_fsid }}/mon.{{ hostvars[cephadm_host_admin_host].inventory_hostname_short }}/config
    -- ceph cephadm get-pub-key
  changed_when: false
  run_once: true
  delegate_to: "{{ cephadm_host_admin_host }}"
  register: _cephadm_get_pub_key
  when: cephadm_host_public_key | length == 0

- name: Resolve the cluster SSH public key to authorise
  # Prefer a caller-provided key; otherwise the one fetched above (available on
  # every host because the fetch is run_once).
  ansible.builtin.set_fact:
    _cephadm_host_pubkey: >-
      {{ cephadm_host_public_key if (cephadm_host_public_key | length > 0)
         else (_cephadm_get_pub_key.stdout | default('')) }}

- name: Assert a cluster SSH key was resolved
  ansible.builtin.assert:
    that: _cephadm_host_pubkey | length > 0
    fail_msg: >-
      No cluster SSH public key resolved for {{ inventory_hostname }} — cannot
      authorise cephadm access (host would fail to join). Check
      `ceph cephadm get-pub-key` on {{ cephadm_host_admin_host }}.

- name: Authorise the cluster SSH key for the cephadm user
  ansible.posix.authorized_key:
    user: "{{ cephadm_host_user }}"
    key: "{{ _cephadm_host_pubkey }}"
    state: present

- name: Derive this host's cephadm labels from inventory membership
  # The FULL set is computed here (not per-calling-role) so mon/mgr/osd runs
  # against the same host all pass the same desired labels. ceph_orch_host
  # diffs labels declaratively (adds missing AND removes extras); passing the
  # complete set every time is what keeps it idempotent for co-located daemons.
  ansible.builtin.set_fact:
    _cephadm_host_labels: >-
      {{ (
           (['mon', '_admin'] if inventory_hostname in groups.get(ceph_mon_group, []) else [])
         + (['mgr', '_admin'] if inventory_hostname in groups.get(ceph_mgr_group, []) else [])
         + (['osd'] if inventory_hostname in groups.get(ceph_osd_group, []) else [])
         + (['rgw'] if inventory_hostname in groups.get(ceph_rgw_group, []) else [])
         + cephadm_host_extra_labels
         ) | unique }}

- name: Find this host's addresses on the public network
  ansible.builtin.set_fact:
    _cephadm_host_addrs: >-
      {{ [ansible_facts.all_ipv4_addresses, ansible_facts.all_ipv6_addresses]
         | flatten | ansible.utils.ipaddr(cephadm_host_public_network) }}

- name: Assert exactly one address matches the public network
  ansible.builtin.assert:
    that: _cephadm_host_addrs | length == 1
    fail_msg: >-
      Expected exactly one address in {{ cephadm_host_public_network }} on
      {{ inventory_hostname }}, found {{ _cephadm_host_addrs | length }}: {{ _cephadm_host_addrs }}.

- name: Register the host (labels)
  vexxhost.ceph.orch_host:
    name: "{{ inventory_hostname_short }}"
    address: "{{ _cephadm_host_addrs | first }}"
    labels: "{{ _cephadm_host_labels }}"
  delegate_to: "{{ cephadm_host_admin_host }}"
  when: cephadm_host_location | length == 0

- name: Register the host with a CRUSH location
  # ceph_orch_host has no location field, so apply a full host spec instead.
  vexxhost.ceph.orch_apply:
    spec: "{{ _cephadm_host_spec | to_nice_yaml }}"
  vars:
    _cephadm_host_spec:
      service_type: host
      hostname: "{{ inventory_hostname_short }}"
      addr: "{{ _cephadm_host_addrs | first }}"
      labels: "{{ _cephadm_host_labels }}"
      location: "{{ cephadm_host_location }}"
  delegate_to: "{{ cephadm_host_admin_host }}"
  when: cephadm_host_location | length > 0
