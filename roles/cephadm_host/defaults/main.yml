# Admin/bootstrap host to delegate `ceph orch` commands to (has the _admin keyring).
cephadm_host_admin_host: "{{ undef(hint='cephadm_host_admin_host is required') }}"

# Local user cephadm logs in as on the managed hosts.
cephadm_host_user: "{{ ceph_ssh_user | default('cephadm') }}"

# Extra cephadm host labels, in addition to those derived from inventory group
# membership (mon/mgr/osd/rgw/_admin). Set as host/group vars for custom labels.
cephadm_host_extra_labels: []

# CRUSH topology for this host (defaults to the shared ceph_host_location).
cephadm_host_location: "{{ ceph_host_location | default({}) }}"

# Cluster SSH public key. When empty, it is fetched from the running cluster
# (`ceph cephadm get-pub-key`). Defaults to the shared caller-provided key.
cephadm_host_public_key: "{{ ceph_ssh_public_key | default('') }}"

# Ceph network used to pick this host's registration address.
cephadm_host_public_network: "{{ ceph_public_network }}"
