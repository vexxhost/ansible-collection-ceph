# Remove the stock default zone/zonegroup and default.rgw.* pools that a plain
# RGW leaves behind. This is intended only for a fresh installation during RGW
# bootstrap, before any user data exists. Destructive — only runs when
# ceph_rgw_remove_default_resources is set.
- name: List RGW zones
  ansible.builtin.command: >-
    cephadm shell --fsid {{ ceph_fsid }} --config {{ _ceph_admin_config }}
    -- radosgw-admin zone list --format json
  register: _rgw_zone_list
  changed_when: false
  delegate_to: "{{ ceph_rgw_admin_host }}"

- name: Remove the default zone / zonegroup / pools
  when: '"default" in (_rgw_zone_list.stdout | from_json).zones'
  delegate_to: "{{ ceph_rgw_admin_host }}"
  block:
    - name: Remove the default zonegroup
      vexxhost.ceph.radosgw_zonegroup:
        name: default
        realm: ""
        state: absent

    - name: Remove the default zone
      vexxhost.ceph.radosgw_zone:
        name: default
        realm: ""
        zonegroup: ""
        state: absent

    - name: Get the current pool deletion setting
      vexxhost.ceph.config:
        action: get
        who: mon
        option: mon_allow_pool_delete
      register: _rgw_pool_delete_setting
      changed_when: false

    - name: Remove the default RGW pools safely
      block:
        - name: Allow pool deletion
          vexxhost.ceph.config:
            who: mon
            option: mon_allow_pool_delete
            value: "true"
          register: _rgw_pool_delete_enabled

        - name: Remove the default RGW pools
          vexxhost.ceph.pool:
            name: "{{ item }}"
            state: absent
          loop:
            - default.rgw.control
            - default.rgw.log
            - default.rgw.meta
          loop_control:
            label: "{{ item }}"

      always:
        - name: Restore the configured pool deletion setting
          vexxhost.ceph.config:
            who: mon
            option: mon_allow_pool_delete
            value: "{{ _rgw_pool_delete_setting.stdout }}"
          when:
            - _rgw_pool_delete_enabled is defined
            - _rgw_pool_delete_enabled is changed
            - _rgw_pool_delete_setting.stdout | length > 0

        - name: Remove the temporary pool deletion setting
          ansible.builtin.command: >-
            cephadm shell --fsid {{ ceph_fsid }}
            --config {{ _ceph_admin_config }}
            -- ceph config rm mon mon_allow_pool_delete
          changed_when: true
          when:
            - _rgw_pool_delete_enabled is defined
            - _rgw_pool_delete_enabled is changed
            - _rgw_pool_delete_setting.stdout | length == 0
