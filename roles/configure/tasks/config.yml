# ceph_config is grouped by `who`, so the entity is named once and its options
# live in a `settings:` list. Flatten to (who, setting) pairs to apply each.
- name: Apply central Ceph configuration
  vexxhost.ceph.config:
    who: "{{ item.0.key }}"
    option: "{{ item.1.name }}"
    value: "{{ item.1.value }}"
  loop: "{{ ceph_config | dict2items | subelements('value.settings', true) }}"
  loop_control:
    label: "{{ item.0.key }}/{{ item.1.name }}"
  run_once: true
  delegate_to: "{{ ceph_configure_admin_host }}"
  no_log: "{{ item.1.sensitive | default(false) }}"
