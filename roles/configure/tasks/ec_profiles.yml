- name: Configure erasure-code profiles
  vexxhost.ceph.ec_profile:
    name: "{{ item.name }}"
    k: "{{ item.k }}"
    m: "{{ item.m }}"
    plugin: "{{ item.plugin | default(omit) }}"
    technique: "{{ item.technique | default(omit) }}"
    # clay / lrc / shec sizing
    d: "{{ item.d | default(omit) }}"
    l: "{{ item.l | default(omit) }}"
    c: "{{ item.c | default(omit) }}"
    scalar_mds: "{{ item.scalar_mds | default(omit) }}"
    # jerasure tuning
    w: "{{ item.w | default(omit) }}"
    packetsize: "{{ item.packetsize | default(omit) }}"
    jerasure_per_chunk_alignment: "{{ item.jerasure_per_chunk_alignment | default(omit) }}"
    # lrc low-level form
    crush_locality: "{{ item.crush_locality | default(omit) }}"
    mapping: "{{ item.mapping | default(omit) }}"
    layers: "{{ item.layers | default(omit) }}"
    crush_steps: "{{ item.crush_steps | default(omit) }}"
    # common CRUSH / loader / stripe
    crush_root: "{{ item.crush_root | default(omit) }}"
    crush_failure_domain: "{{ item.crush_failure_domain | default(omit) }}"
    crush_device_class: "{{ item.crush_device_class | default(omit) }}"
    crush_num_failure_domains: "{{ item.crush_num_failure_domains | default(omit) }}"
    crush_osds_per_failure_domain: "{{ item.crush_osds_per_failure_domain | default(omit) }}"
    directory: "{{ item.directory | default(omit) }}"
    stripe_unit: "{{ item.stripe_unit | default(omit) }}"
    force: "{{ item.force | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ ceph_ec_profiles }}"
  loop_control:
    loop_var: item
    label: "{{ item.name }}"
  run_once: true
  delegate_to: "{{ ceph_configure_admin_host }}"
