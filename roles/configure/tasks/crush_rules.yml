- name: Configure CRUSH rules
  vexxhost.ceph.crush_rule:
    name: "{{ item.name }}"
    rule_type: "{{ item.rule_type }}"
    bucket_root: "{{ item.bucket_root | default(omit, true) }}"
    bucket_type: "{{ item.bucket_type | default(omit, true) }}"
    device_class: "{{ item.device_class | default(omit, true) }}"
    profile: "{{ item.profile | default(omit, true) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ ceph_crush_rules }}"
  loop_control:
    loop_var: item
    label: "{{ item.name }}"
  run_once: true
  delegate_to: "{{ ceph_configure_admin_host }}"
