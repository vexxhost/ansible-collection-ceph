galaxy_info:
  author: VEXXHOST, Inc.
  description: Ansible role for Cephadm
  license: Apache-2.0
  min_ansible_version: 5.5.0
  standalone: false
  platforms:
    - name: Ubuntu
      versions:
        - focal
        - jammy
        - noble

dependencies:
  - role: defaults
  - role: vexxhost.containers.docker
  - role: vexxhost.containers.download_artifact
    vars:
      download_artifact_url: "{{ cephadm_download_url }}"
      download_artifact_dest: "{{ cephadm_download_dest }}"
      download_artifact_checksum: "sha256:{{ cephadm_binary_checksum }}"
      download_artifact_owner: root
      download_artifact_mode: "0o755"
      download_artifact_http_proxy: "{{ cephadm_http_proxy }}"
      download_artifact_https_proxy: "{{ cephadm_https_proxy }}"
      download_artifact_no_proxy: "{{ cephadm_no_proxy }}"
