- name: Gather variables for each operating system
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_version'] | lower }}.yml"
    - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] | lower }}.yml"
    - "{{ ansible_facts['os_family'] | lower }}-{{ ansible_facts['distribution_major_version'] | lower }}.yml"
    - "{{ ansible_facts['distribution'] | lower }}.yml"
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Install packages
  ansible.builtin.package:
    name: "{{ cephadm_packages }}"

- name: Ensure services are started
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
  loop: "{{ cephadm_services }}"

- name: Remove cephadm from old path
  ansible.builtin.file:
    path: /usr/local/bin/cephadm
    state: absent

- name: Ensure the cephadm SSH user exists
  ansible.builtin.user:
    name: "{{ ceph_ssh_user }}"
    shell: /bin/bash
    create_home: true

- name: Grant passwordless sudo to the cephadm SSH user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ ceph_ssh_user }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ ceph_ssh_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: "visudo -cf %s"

- name: Log in to the container registry
  community.docker.docker_login:
    registry: "{{ ceph_registry_url }}"
    username: "{{ ceph_registry_username }}"
    password: "{{ ceph_registry_password }}"
  when: ceph_registry_username | length > 0

- name: Pre-pull the Ceph image
  community.docker.docker_image:
    name: "{{ ceph_image }}"
    source: pull
    state: present

- name: Pin CEPHADM_IMAGE for interactive login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/cephadm.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by vexxhost.ceph (cephadm role). Speeds up manual
      # `cephadm shell` by pinning the image (skips image inference).
      export CEPHADM_IMAGE={{ ceph_image }}
